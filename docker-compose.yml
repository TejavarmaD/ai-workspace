version: "3.9"

services:
  db:
    image: postgres:16
    container_name: ai-workspace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiworkspace
      POSTGRES_USER: aiworkspace
      POSTGRES_PASSWORD: aiworkspace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiworkspace"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: ai-workspace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
